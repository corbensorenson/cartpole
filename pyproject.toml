[project]
name = "gradient-cartpole"
version = "0.1.0"
description = "n-link gradient curriculum cart-pole experiments with MuJoCo + MLX PPO"
requires-python = ">=3.10"

[project.optional-dependencies]
interior-point = ["clarabel==0.11.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
