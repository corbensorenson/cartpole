experiment:
  name: swingup11_route_residual_handoff
  seed: 111
  out_dir: runs/generalized_solver/n11_route_residual_handoff_ppo_rail20

env:
  n_links: 11
  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 20.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 20.0
  init_mode: hanging
  init_cart_noise: 0.0
  init_cart_vel_noise: 0.0
  init_angle_noise: 0.0
  init_vel_noise: 0.0
  terminate_abs_angle: null
  success_upright_threshold: 0.15
  success_sustain_seconds: 5.0
  cart_damping: 0.02
  cart_frictionloss: 0.0
  joint_armature: 0.0005
  link_radius: 0.025
  obs_include_morphology: true
  obs_include_frictionloss: false
  obs_include_time: true
  obs_time_scale_seconds: 20.0
  obs_time_frequencies: []
  obs_include_route_features: true
  action_route_residual:
    enabled: true
    path: runs/generalized_solver/n11_p39_feedback_a1rm1.json
    tracking_gain_scale: 0.5
    phase_window: 12
    residual_scale: 0.5
    residual_action_limit: 1.0
  reward:
    alive: 0.0
    terminal_penalty: -200.0
    angle_cos: 3.0
    upright_bonus: 45.0
    sustained_upright_bonus: 10.0
    upright_streak: 12.0
    capture_quality: 8.0
    angle_abs: 1.0
    angle_rel: 0.02
    tip: 0.50
    cart_pos: 1.00
    cart_vel: 0.002
    hinge_vel: 0.0005
    control: 0.0010
    upright_threshold: 0.15
    upright_streak_cap_seconds: 5.0
    handoff_bank_path: runs/generalized_solver/n11_p39_low_momentum_handoff_states.json
    handoff_distance_progress: 10.0
    handoff_distance_cost: 0.05
    handoff_bank_threshold: 0.75
    handoff_bank_bonus: 5.0

morphology:
  schedule_mode: all_linear
  start:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    alpha_frictionloss: 0.0
    total_damping: 0.015
    total_frictionloss: 0.0
  end:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    alpha_frictionloss: 0.0
    total_damping: 0.015
    total_frictionloss: 0.0

ppo:
  backend: mlx
  vec_backend: subprocess
  num_envs: 16
  rollout_steps: 128
  total_updates: 600
  minibatches: 8
  epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate: 0.00005
  clip_coef: 0.20
  entropy_coef: 0.002
  value_coef: 0.50
  max_grad_norm: 0.50
  hidden_sizes: [256, 256]
  action_std_init: 0.20
  normalize_advantages: true
  zero_init_actor_output: true
  checkpoint_every: 50
  eval_every: 50
  eval_episodes: 8
  curriculum_mode: gated
  curriculum_start_progress: 1.0
  curriculum_step: 0.0
