experiment:
  name: swingup10_capture_endpoint
  seed: 20260917
  out_dir: runs/swingup10_capture_endpoint

env:
  n_links: 10
  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 3.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 12.0
  init_mode: state_list
  init_states_path: runs/generalized_solver/n10_current_exact_ilqr_centered_terminal8_state.json
  init_state_curriculum: all
  init_angle_noise: 0.0
  init_vel_noise: 0.0
  init_cart_noise: 0.0
  init_cart_vel_noise: 0.0
  terminate_abs_angle: null
  success_upright_threshold: 0.15
  success_sustain_seconds: 5.0
  cart_damping: 0.02
  cart_frictionloss: 0.0
  joint_armature: 0.0005
  link_radius: 0.025
  obs_include_morphology: true
  obs_include_frictionloss: false
  obs_include_time: false
  obs_include_capture_features: true
  obs_include_absolute_velocity: true
  action_lqr_residual:
    enabled: false
  action_lqr_switch:
    enabled: false
  reward:
    alive: 0.0
    terminal_penalty: -300.0
    angle_cos: 3.0
    upright_bonus: 22.0
    sustained_upright_bonus: 20.0
    capture_quality: 10.0
    capture_angle_scale: 0.20
    capture_hinge_vel_scale: 0.75
    capture_cart_pos_abs_scale: 1.25
    capture_cart_vel_scale: 0.50
    upright_low_velocity_bonus: 32.0
    upright_hinge_vel_threshold: 0.75
    upright_cart_vel_threshold: 0.50
    centered_upright_max_cart_abs: 1.25
    low_momentum_max_cart_abs: 1.25
    upright_streak: 18.0
    upright_streak_cap_seconds: 5.0
    centered_upright_streak: 24.0
    centered_upright_streak_cap_seconds: 5.0
    low_momentum_upright_streak: 32.0
    low_momentum_upright_streak_cap_seconds: 5.0
    angle_abs: 1.2
    angle_rel: 0.05
    tip: 0.25
    cart_pos: 4.0
    cart_vel: 0.06
    hinge_vel: 0.008
    rail_margin: 160.0
    control: 0.001
    upright_threshold: 0.15

morphology:
  schedule_mode: all_linear
  start:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    alpha_frictionloss: 0.0
    total_damping: 0.015
    total_frictionloss: 0.0
  end:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    alpha_frictionloss: 0.0
    total_damping: 0.015
    total_frictionloss: 0.0

ppo:
  backend: torch
  vec_backend: serial
  device: cpu
  torch_num_threads: 1
  num_envs: 32
  rollout_steps: 128
  total_updates: 800
  minibatches: 4
  epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate: 0.0001
  clip_coef: 0.20
  entropy_coef: 0.005
  value_coef: 0.50
  max_grad_norm: 0.50
  hidden_sizes: [256, 256]
  action_std_init: 0.10
  zero_init_actor_output: true
  normalize_advantages: true
  checkpoint_every: 50
  eval_every: 50
  eval_episodes: 1
  curriculum_mode: gated
  curriculum_start_progress: 1.0
  curriculum_step: 0.0
  eval_progress: current
  curriculum_eval_states_path: runs/generalized_solver/n10_current_exact_ilqr_centered_terminal8_state.json
