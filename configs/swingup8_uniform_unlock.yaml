experiment:
  name: swingup8_uniform_unlock
  seed: 108
  out_dir: runs/swingup8_uniform_unlock

env:
  n_links: 8
  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 3.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 30.0
  init_mode: hanging
  init_cart_noise: 0.0
  init_cart_vel_noise: 0.0
  init_angle_noise: 0.0
