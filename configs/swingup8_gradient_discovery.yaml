experiment:
  name: swingup8_gradient_discovery
  seed: 108
  out_dir: runs/swingup8_gradient_discovery

env:
  n_links: 8
  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 3.0
  rail_limit_start: 9.0
  rail_limit_end: 3.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 30.0
  init_mode: hanging
  init_cart_noise: 0.0
  init_cart_vel_noise: 0.0
  init_angle_noise: 0.0
  init_vel_noise: 0.0
  terminate_abs_angle: null
  success_upright_threshold: 0.15
  success_sustain_seconds: 5.0
  cart_damping: 0.02
  cart_frictionloss: 0.0
  joint_armature: 0.0005
  link_radius: 0.025
  obs_include_morphology: true
  obs_include_frictionloss: true
  obs_include_time: false
  reward:
    alive: 0.0
    terminal_penalty: -200.0
    angle_cos: 3.0
    upright_bonus: 45.0
    sustained_upright_bonus: 10.0
    upright_streak: 12.0
    capture_quality: 8.0
    angle_abs: 1.0
    angle_rel: 0.02
    tip: 0.50
    cart_pos: 1.00
    cart_vel: 0.002
    hinge_vel: 0.0005
    control: 0.0010
    upright_threshold: 0.15
    upright_streak_cap_seconds: 5.0

morphology:
  schedule_mode: swingup_slow
  start:
    alpha_length: 0.65
    alpha_mass: 5.0
    alpha_damping: 2.5
    total_damping: 0.120
    alpha_frictionloss: 3.0
    total_frictionloss: 0.060
  end:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    total_damping: 0.015
    alpha_frictionloss: 0.0
    total_frictionloss: 0.0
