morphology:
  schedule_mode: all_linear
  start:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    total_damping: 0.015
    alpha_frictionloss: 0.0
    total_frictionloss: 0.0
  end:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    total_damping: 0.015
    alpha_frictionloss: 0.0
    total_frictionloss: 0.0

ppo:
  backend: torch
  vec_backend: serial
  device: cpu
  torch_num_threads: 1
  num_envs: 32
  rollout_steps: 256
  total_updates: 3500
  minibatches: 8
  epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate: 0.00005
  clip_coef: 0.20
  entropy_coef: 0.005
  value_coef: 0.50
  max_grad_norm: 0.50
  hidden_sizes: [256, 256]
  action_std_init: 0.02
  zero_init_actor_output: true
  normalize_advantages: true
  checkpoint_every: 50
  eval_every: 50
  eval_episodes: 16
  curriculum_mode: gated
  curriculum_start_progress: 0.0
  curriculum_step: 0.025
  curriculum_min_updates_per_stage: 75
  curriculum_gate_consecutive_evals: 2
  curriculum_gate_success_rate: 0.70
  curriculum_gate_ever_upright_rate: 0.90
  curriculum_gate_low_momentum_upright_rate: 0.60
  curriculum_gate_mean_upright_streak: 3.0
  curriculum_gate_max_upright_streak: 4.0
  curriculum_gate_max_capture_quality: 0.45
  eval_progress: current
