  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 3.0
  rail_limit_start: 9.0
  rail_limit_end: 3.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 20.0
  init_mode: hanging_curriculum
  hanging_curriculum_power: 1.0
  init_cart_noise_start: 0.0
