experiment:
  name: swingup6_torch_energy_homotopy
  seed: 613
  out_dir: runs/swingup6_torch_energy_homotopy

env:
  n_links: 6
  total_length: 3.0
  total_mass: 1.0
  cart_mass: 1.0
  rail_limit: 3.0
  # A deliberately generous early rail tests whether the policy needs room
  # for a single long wind-up before the final +/-3 m task is restored.
  rail_limit_start: 30.0
  rail_limit_end: 3.0
  force_limit: 80.0
  timestep: 0.005
  frame_skip: 4
  episode_seconds: 30.0
  init_mode: hanging_curriculum
  hanging_curriculum_power: 1.0
  init_angle_noise: 0.04
  init_vel_noise: 0.04
  terminate_abs_angle: null
  success_upright_threshold: 0.15
  success_sustain_seconds: 5.0
  cart_damping: 0.02
  joint_armature: 0.0005
  link_radius: 0.025
  obs_include_morphology: true
  obs_include_frictionloss: true
  curriculum_rebuild_every: 25
  reward:
    alive: 0.0
    terminal_penalty: -250.0
    angle_cos: 3.0
    upright_bonus: 30.0
    sustained_upright_bonus: 20.0
    capture_quality: 120.0
    capture_angle_scale: 0.24
    capture_hinge_vel_scale: 0.90
    capture_cart_pos_scale: 0.50
    capture_cart_pos_abs_scale: 1.50
    capture_cart_vel_scale: 0.65
    upright_low_velocity_bonus: 45.0
    upright_hinge_vel_threshold: 0.70
    upright_cart_vel_threshold: 0.45
    low_momentum_min_time_seconds: 0.50
    low_momentum_reward_min_time_seconds: 0.50
    low_momentum_max_cart_abs: 2.50
    angle_abs: 1.0
    angle_rel: 0.03
    tip: 0.50
    cart_pos: 0.40
    cart_vel: 0.006
    hinge_vel: 0.006
    rail_margin: 16.0
    rail_margin_start: 0.75
    control: 0.0012
    upright_threshold: 0.15
    # Temporary global-discovery signal. The coefficients are removed at
    # progress 1.0, leaving the exact reward for final evidence.
    energy_progress_start: 40.0
    energy_progress_end: 0.0
    energy_level_start: 4.0
    energy_level_end: 0.0

morphology:
  schedule_mode: swingup_slow
  start:
    alpha_length: 0.65
    alpha_mass: 5.0
    alpha_damping: 2.5
    total_damping: 0.120
    alpha_frictionloss: 3.0
    total_frictionloss: 0.060
  end:
    alpha_length: 0.0
    alpha_mass: 0.0
    alpha_damping: 0.0
    total_damping: 0.015
    alpha_frictionloss: 0.0
    total_frictionloss: 0.0

ppo:
  backend: torch
  vec_backend: subprocess
  device: cpu
  torch_num_threads: 1
  num_envs: 16
  rollout_steps: 256
  total_updates: 1200
  minibatches: 8
  epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  learning_rate: 0.00025
  clip_coef: 0.20
  entropy_coef: 0.020
  value_coef: 0.50
  max_grad_norm: 0.50
  hidden_sizes: [256, 256]
  action_std_init: 0.55
  normalize_advantages: true
  checkpoint_every: 50
  eval_every: 50
  eval_episodes: 4
  curriculum_mode: linear
  curriculum_start_progress: 0.0
  eval_progress: current
